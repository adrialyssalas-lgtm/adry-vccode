<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Perfect Balance Studio</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
      text-align: center;
      background-color: #121212;
      color: #fff;
    }
    .titulo-arcoiris {
      font-size: 3rem;
      font-weight: 900;
      text-transform: uppercase;
      margin-top: 40px;
      background: linear-gradient(45deg,#ff0000,#ff7300,#fffb00,#48ff00,#00ffd5,#002bff,#7a00ff,#ff00c8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      color: transparent;
    }
    .botoes { margin: 40px auto; display: flex; justify-content: center; gap: 20px; }
    .btn { border: none; padding: 15px 25px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    .btn-60 { background:#f4f4f9; color:#000; }
    .btn-30 { background:#1e293b; color:#fff; }
    .btn-10 { background:#ff4757; color:#fff; }
  </style>
</head>
<body>
  <h1 class="titulo-arcoiris">PERFECT BALANCE STUDIO</h1>
  <p>A regra <strong>60-30-10</strong> ajuda a equilibrar cores em projetos visuais.</p>

  <div class="botoes">
    <button class="btn btn-60" onclick="gerarIA('Paisagem com árvores e flores, regra 60-30-10')">🌳 Árvores</button>
    <button class="btn btn-30" onclick="gerarIA('Cidade estilizada com cores 60-30-10')">🏙️ Cidade</button>
    <button class="btn btn-10" onclick="gerarIA('Flores coloridas em harmonia 60-30-10')">🌸 Flores</button>
  </div>

  <script>
    async function gerarIA(prompt) {
      const resposta = await fetch("https://api.openai.com/v1/images/generations", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer SUA_CHAVE_AQUI" // ⚠️ coloque sua chave aqui
        },
        body: JSON.stringify({
          model: "dall-e-3",
          prompt: prompt,
          size: "1024x1024"
        })
      });

      const dados = await resposta.json();
      const urlImagem = dados.data[0].url;
      document.body.style.backgroundImage = `url(${urlImagem})`;
      document.body.style.backgroundSize = "cover";
    }
  </script>
</body>
</html>
