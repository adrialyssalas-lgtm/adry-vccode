<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Perfect Balance Studio</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
      text-align: center;
      background-color: #121212;
      color: #fff;
    }
    .titulo-arcoiris {
      font-size: 3rem;
      font-weight: 900;
      text-transform: uppercase;
      margin-top: 40px;
      background: linear-gradient(45deg,#ff0000,#ff7300,#fffb00,#48ff00,#00ffd5,#002bff,#7a00ff,#ff00c8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      color: transparent;
    }
    .explicacao {
      max-width: 800px;
      margin: 20px auto;
      font-size: 1.2rem;
      line-height: 1.6;
    }
    .botoes {
      margin: 30px auto;
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
    }
    .btn {
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 1rem;
      transition: transform 0.2s ease;
    }
    .btn:hover { transform: scale(1.05); }
    .btn-60 { background:#f4f4f9; color:#000; }
    .btn-30 { background:#1e293b; color:#fff; }
    .btn-10 { background:#ff4757; color:#fff; }
    canvas { display:block; margin:20px auto; border:2px solid #fff; }
  </style>
</head>
<body>

  <h1 class="titulo-arcoiris">PERFECT BALANCE STUDIO</h1>

  <div class="explicacao">
    <p>
      A regra <strong>60-30-10</strong> é um padrão de referência para o equilíbrio de cores.  
      Ela destina <strong>60%</strong> à cor dominante, <strong>30%</strong> à cor secundária e <strong>10%</strong> à cor de destaque.  
      Designers utilizam essa proporção para criar harmonia visual em projetos.
    </p>
  </div>

  <!-- Botões de proporção -->
  <div class="botoes">
    <button class="btn btn-60" onclick="aplicarFundo('60')">60% Dominante</button>
    <button class="btn btn-30" onclick="aplicarFundo('30')">30% Secundária</button>
    <button class="btn btn-10" onclick="aplicarFundo('10')">10% Destaque</button>
  </div>

  <!-- Canvas para desenhar -->
  <canvas id="fundo" width="800" height="500"></canvas>

  <!-- Botões de arte -->
  <div class="botoes">
    <button class="btn btn-60" onclick="gerarArte('arvores')">🌳 Floresta</button>
    <button class="btn btn-30" onclick="gerarArte('flores')">🌸 Jardim</button>
    <button class="btn btn-10" onclick="gerarArte('cidade')">🏙️ Cidade</button>
  </div>

  <script>
    // Botões de proporção mudam o gradiente do body
    function aplicarFundo(tipo) {
      if (tipo === '60') {
        document.body.style.background = "linear-gradient(60deg, #f4f4f9 60%, #1e293b 40%)";
      } else if (tipo === '30') {
        document.body.style.background = "linear-gradient(90deg, #1e293b 30%, #f4f4f9 70%)";
      } else if (tipo === '10') {
        document.body.style.background = "linear-gradient(120deg, #ff4757 10%, #f4f4f9 90%)";
      }
    }

    // Canvas para desenhar arte estilizada
    function gerarArte(tipo) {
      const canvas = document.getElementById("fundo");
      const ctx = canvas.getContext("2d");
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (tipo === "arvores") {
        // Floresta estilizada
        ctx.fillStyle = "#87CEEB"; // céu
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#228B22"; // chão
        ctx.fillRect(0, canvas.height-150, canvas.width, 150);
        // árvores com efeito artístico
        for (let i = 0; i < 12; i++) {
          let x = Math.random()*canvas.width;
          ctx.fillStyle = "#2e1d0e"; // tronco
          ctx.fillRect(x, canvas.height-150, 15, 100);
          ctx.fillStyle = "#006400"; // copa
          ctx.beginPath();
          ctx.arc(x+7, canvas.height-170, 50, 0, Math.PI*2);
          ctx.fill();
        }
      } else if (tipo === "flores") {
        // Jardim estilizado
        ctx.fillStyle = "#f4f4f9";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        for (let i = 0; i < 60; i++) {
          let x = Math.random()*canvas.width;
          let y = Math.random()*canvas.height;
          ctx.fillStyle = ["#FF69B4","#FFD700","#FF4500","#ADFF2F"][Math.floor(Math.random()*4)];
          ctx.beginPath();
          ctx.arc(x, y, 12, 0, Math.PI*2);
          ctx.fill();
        }
      } else if (tipo === "cidade") {
        // Cidade estilizada
        ctx.fillStyle = "#1e293b"; // céu noturno
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        for (let i = 0; i < 15; i++) {
          let x = i*55;
          let h = Math.random()*300+100;
          ctx.fillStyle = "#2c3e50";
          ctx.fillRect(x, canvas.height-h, 40, h);
          ctx.fillStyle = "#FFD700"; // janelas iluminadas
          for (let j = 0; j < h/50; j++) {
            ctx.fillRect(x+10, canvas.height-h+10+j*50, 8, 8);
          }
        }
      }
    }
  </script>

</body>
</html>
